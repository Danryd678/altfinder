<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AltFinder — Find a better app</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #070a14;
    background-image:
      radial-gradient(600px 300px at 15% -5%, rgba(45,212,191,.22), transparent 60%),
      radial-gradient(700px 340px at 90% 0%, rgba(168,85,247,.20), transparent 60%),
      linear-gradient(180deg, #070a14 0%, #0a0f1e 100%);
    background-attachment: fixed;
    color: #e8ecf5;
    min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }

  header {
    padding: 26px 16px 14px;
    text-align: center;
  }
  .logo {
    font-size: 40px; font-weight: 800; letter-spacing: -1px;
  }
  .logo span {
    background: linear-gradient(90deg, #2dd4bf, #a855f7);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .tagline { color: #9aa7c2; font-size: 16px; margin-top: 4px; }
  .search-wrap { max-width: 560px; margin: 18px auto 4px; }
  #search {
    width: 100%; padding: 14px 18px; font-size: 17px;
    color: #fff; background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.16); border-radius: 999px;
    outline: none; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  #search::placeholder { color: #8494b3; }
  #search:focus { border-color: #2dd4bf; box-shadow: 0 0 0 3px rgba(45,212,191,.25); }

  #chips {
    display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 6px;
    max-width: 960px; margin: 0 auto; scrollbar-width: none;
  }
  #chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; padding: 8px 14px; font-size: 14px; cursor: pointer;
    color: #c6cfe2; background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.13); border-radius: 999px;
  }
  .chip.active {
    color: #fff; border-color: transparent;
    background: linear-gradient(90deg, #0d9488, #9333ea);
  }

  main { max-width: 960px; margin: 0 auto; padding: 14px 16px 30px; }
  .section-title { font-size: 20px; font-weight: 700; margin: 8px 0 14px; }
  .muted { color: #9aa7c2; font-size: 14px; }

  .grid {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  }
  .card {
    display: block; padding: 16px; border-radius: 16px; cursor: pointer;
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.11);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .card:active { transform: scale(.98); }
  .card h3 { font-size: 17px; margin-bottom: 6px; word-break: break-word; }
  .card .cat { color: #9aa7c2; font-size: 12.5px; margin-bottom: 8px; }
  .card .plats { color: #8494b3; font-size: 12px; line-height: 1.5; margin-top: 8px; }
  .card .meta {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 2px 10px;
    margin-top: 10px; color: #c6cfe2; font-size: 13px;
  }
  .card .meta > span { white-space: nowrap; }
  .heart { color: #f472b6; }

  .badge {
    display: inline-block; padding: 3px 9px; border-radius: 999px;
    font-size: 11.5px; font-weight: 700; letter-spacing: .2px; white-space: nowrap;
  }
  .badge-free { background: rgba(34,197,94,.18); color: #4ade80; border: 1px solid rgba(34,197,94,.45); }
  .badge-freemium { background: rgba(245,158,11,.16); color: #fbbf24; border: 1px solid rgba(245,158,11,.45); }
  .badge-opensource { background: rgba(59,130,246,.16); color: #60a5fa; border: 1px solid rgba(59,130,246,.45); }
  .badge-paid { background: rgba(244,63,94,.15); color: #fb7185; border: 1px solid rgba(244,63,94,.45); }

  .back-link {
    display: inline-block; margin-bottom: 14px; color: #2dd4bf; font-size: 15px;
  }
  .detail-head {
    padding: 20px; border-radius: 18px; margin-bottom: 16px;
    background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.11);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .detail-head h2 { font-size: 26px; margin-bottom: 8px; }
  .detail-head .desc { color: #c6cfe2; margin-top: 10px; line-height: 1.55; }
  .detail-head .plats { color: #8494b3; font-size: 13px; margin-top: 8px; }

  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .filters select {
    flex: 1 1 140px; padding: 11px 12px; font-size: 15px; color: #fff;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16);
    border-radius: 12px; outline: none;
  }
  .filters select option { color: #111; }

  .alt-card {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 15px 16px; border-radius: 16px; margin-bottom: 10px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.10);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .alt-main { flex: 1 1 auto; min-width: 0; }
  .alt-main h4 { font-size: 16.5px; margin-bottom: 5px; }
  .alt-main .adesc { color: #c6cfe2; font-size: 14px; line-height: 1.5; margin-top: 7px; }
  .alt-main .plats { color: #8494b3; font-size: 12px; margin-top: 6px; }
  .like-btn {
    flex: 0 0 auto; cursor: pointer; border-radius: 999px;
    padding: 9px 13px; font-size: 14px; font-weight: 700;
    color: #c6cfe2; background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.16);
  }
  .like-btn .heart { color: #8494b3; }
  .like-btn.liked {
    color: #fff; border-color: rgba(244,114,182,.55);
    background: rgba(244,114,182,.18);
  }
  .like-btn.liked .heart { color: #f472b6; }

  .empty {
    text-align: center; color: #9aa7c2; padding: 34px 10px; font-size: 15px;
  }

  footer {
    text-align: center; color: #8494b3; font-size: 13px;
    padding: 18px 16px 30px; max-width: 960px; margin: 0 auto;
  }
</style>
</head>
<body>
<header>
  <div class="logo">Alt<span>Finder</span></div>
  <p class="tagline">Find a better app</p>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search apps… e.g. WhatsApp, Photoshop, Spotify" autocomplete="off">
  </div>
</header>
<nav id="chips" aria-label="Categories"></nav>
<main id="app"></main>
<footer>AltFinder — free forever. Data seeded by hand; likes save on your device.</footer>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
